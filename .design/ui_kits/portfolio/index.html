<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feiko van Dijk · Kubernetes Engineer & Game Designer</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="kit.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <script src="data.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="views.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [route, setRoute] = useState({ view: "home", id: null });
      const [theme, setTheme] = useState(() => localStorage.getItem("fvd-theme") || "dark");

      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
        localStorage.setItem("fvd-theme", theme);
      }, [theme]);
      // Re-render Lucide icons after every paint
      useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

      const go = (view, id = null) => {
        if (window.KIT.projects.some(p => p.id === view)) { setRoute({ view: "detail", id: view }); }
        else { setRoute({ view, id }); }
        window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
      };
      const toggleTheme = () => setTheme(t => t === "dark" ? "light" : "dark");

      return (
        <React.Fragment>
          <Nav view={route.view} go={go} theme={theme} toggleTheme={toggleTheme} />
          {route.view === "home" && <HomeView go={go} />}
          {route.view === "about" && <AboutView />}
          {route.view === "detail" && <DetailView id={route.id} go={go} />}
          <Footer />
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
