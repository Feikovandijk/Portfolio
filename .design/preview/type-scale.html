<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">

<div class="label" style="margin-bottom:14px;">Type scale</div>
<div class="col" style="gap:7px;">
  <div class="row" style="align-items:baseline;gap:14px;"><span class="sw-hex" style="width:58px;">64 / 4xl</span><span style="font-family:var(--font-display);font-weight:700;font-size:40px;letter-spacing:-0.02em;line-height:1;">Display</span></div>
  <div class="row" style="align-items:baseline;gap:14px;"><span class="sw-hex" style="width:58px;">48 / 3xl</span><span style="font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:-0.018em;line-height:1;">Heading 1</span></div>
  <div class="row" style="align-items:baseline;gap:14px;"><span class="sw-hex" style="width:58px;">36 / 2xl</span><span style="font-family:var(--font-display);font-weight:600;font-size:26px;line-height:1;">Heading 2</span></div>
  <div class="row" style="align-items:baseline;gap:14px;"><span class="sw-hex" style="width:58px;">22 / lg</span><span style="font-family:var(--font-display);font-weight:600;font-size:20px;line-height:1;">Heading 3</span></div>
  <div class="row" style="align-items:baseline;gap:14px;"><span class="sw-hex" style="width:58px;">16 / base</span><span style="font-family:var(--font-body);font-size:16px;line-height:1;color:var(--fg-2);">Body, the readable baseline</span></div>
  <div class="row" style="align-items:baseline;gap:14px;"><span class="sw-hex" style="width:58px;">12 / label</span><span style="font-family:var(--font-mono);font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-3);">Mono label</span></div>
</div>
