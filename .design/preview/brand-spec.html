<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .spec { background: var(--bg-1); border:1px solid var(--border-1); border-radius: var(--radius-lg); padding: 22px 24px; }
  .spec h4 { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); margin:0 0 14px; }
  .srow { display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-bottom:1px solid var(--border-1); }
  .srow:last-child { border-bottom:none; }
  .srow .k { font-family: var(--font-mono); font-size:12px; color: var(--fg-3); }
  .srow .v { font-family: var(--font-body); font-size:14px; color: var(--fg-1); }
</style>
</head><body>
<div class="label" style="margin-bottom:14px;">Spec sheet · structured metadata</div>
<div class="spec">
  <h4>Project · Arid</h4>
  <div class="srow"><span class="k">team</span><span class="v">21 developers</span></div>
  <div class="srow"><span class="k">duration</span><span class="v">9 months</span></div>
  <div class="srow"><span class="k">platforms</span><span class="v">Steam · PlayStation 4</span></div>
  <div class="srow"><span class="k">downloads</span><span class="v">200,000+ in month one</span></div>
</div>
</body></html>
