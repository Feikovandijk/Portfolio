<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="label" style="margin-bottom:14px;">Brand · primary &amp; accent</div>
<div class="grid-4">
  <div class="col">
    <div class="swatch" style="background:var(--k8s-blue);"></div>
    <div class="sw-meta"><div class="sw-name">Kubernetes blue</div><div class="sw-hex">#326CE5 · primary</div></div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--k8s-blue-bright);"></div>
    <div class="sw-meta"><div class="sw-name">Blue bright</div><div class="sw-hex">#5B8DEF · hover</div></div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--sand);"></div>
    <div class="sw-meta"><div class="sw-name">Desert sand</div><div class="sw-hex">#E8A24C · accent</div></div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--terracotta);"></div>
    <div class="sw-meta"><div class="sw-name">Terracotta</div><div class="sw-hex">#C9683A · deep</div></div>
  </div>
</div>
<div style="margin-top:16px; font-family:var(--font-body); font-size:13px; color:var(--fg-2); line-height:1.5;">
  Cloud blue (k8s) &amp; desert amber (Arid): the two halves of the brand, held on slate.
</div>
</body></html>
