<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .btn { font-family: var(--font-body); font-weight:600; font-size:14px; border-radius: var(--radius-md);
    padding: 10px 16px; display:inline-flex; align-items:center; gap:8px; cursor:pointer; border:1px solid transparent;
    transition: all .2s ease; }
  .btn-primary { background: var(--primary); color:#fff; }
  .btn-primary:hover { background: var(--primary-hover); box-shadow: var(--glow-primary); }
  .btn-secondary { background: var(--bg-2); color: var(--fg-1); border-color: var(--border-2); }
  .btn-secondary:hover { background: var(--bg-3); }
  .btn-ghost { background: transparent; color: var(--fg-2); }
  .btn-ghost:hover { color: var(--fg-1); background: var(--bg-2); }
  .btn-accent { background: var(--sand); color:#1a130a; }
  .btn-accent:hover { background: var(--sand-bright); }
  .btn svg { width:16px; height:16px; }
</style>
</head><body>
<div class="label" style="margin-bottom:16px;">Buttons</div>
<div class="wrap" style="gap:12px;">
  <button class="btn btn-primary">View details <i data-lucide="arrow-right"></i></button>
  <button class="btn btn-secondary"><i data-lucide="github"></i> GitHub</button>
  <button class="btn btn-accent"><i data-lucide="play"></i> Play</button>
  <button class="btn btn-ghost">Read more</button>
</div>
<div class="wrap" style="gap:12px;margin-top:14px;">
  <button class="btn btn-primary" style="background:var(--k8s-blue-deep);transform:scale(.98);">Pressed</button>
  <button class="btn btn-secondary" style="opacity:.45;">Disabled</button>
  <button class="btn btn-primary" style="padding:7px 12px;font-size:13px;"><i data-lucide="terminal"></i> kubectl</button>
</div>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
