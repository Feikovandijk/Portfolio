<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="label" style="margin-bottom:14px;">Radii</div>
<div class="row" style="gap:18px;align-items:flex-end;">
  <div class="col" style="align-items:center;gap:8px;"><div style="width:64px;height:48px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius-xs);"></div><span class="sw-hex">4 · xs</span></div>
  <div class="col" style="align-items:center;gap:8px;"><div style="width:64px;height:48px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius-sm);"></div><span class="sw-hex">6 · sm</span></div>
  <div class="col" style="align-items:center;gap:8px;"><div style="width:64px;height:48px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius-md);"></div><span class="sw-hex">10 · md</span></div>
  <div class="col" style="align-items:center;gap:8px;"><div style="width:64px;height:48px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius-lg);"></div><span class="sw-hex">14 · lg</span></div>
  <div class="col" style="align-items:center;gap:8px;"><div style="width:64px;height:48px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius-xl);"></div><span class="sw-hex">20 · xl</span></div>
  <div class="col" style="align-items:center;gap:8px;"><div style="width:48px;height:48px;background:var(--bg-2);border:1px solid var(--border-2);border-radius:var(--radius-pill);"></div><span class="sw-hex">pill</span></div>
</div>
</body></html>
