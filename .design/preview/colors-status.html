<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="label" style="margin-bottom:14px;">Semantic · signal colors (used sparingly)</div>
<div class="grid-4">
  <div class="col">
    <div class="swatch" style="background:var(--status-running);"></div>
    <div class="sw-meta"><div class="sw-name">positive</div><div class="sw-hex">#3FB950</div></div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--status-warning);"></div>
    <div class="sw-meta"><div class="sw-name">caution</div><div class="sw-hex">#D9A441</div></div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--status-error);"></div>
    <div class="sw-meta"><div class="sw-name">critical</div><div class="sw-hex">#F0533F</div></div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--status-info);"></div>
    <div class="sw-meta"><div class="sw-name">info</div><div class="sw-hex">#58A6FF</div></div>
  </div>
</div>
<div style="margin-top:16px; font-family:var(--font-body); font-size:13px; color:var(--fg-2); line-height:1.5;">
  Reserved for genuine signals, never as decoration. Most of the UI lives in slate, blue &amp; sand.
</div>
</body></html>
