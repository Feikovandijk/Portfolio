<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="label" style="margin-bottom:14px;">Neutrals · terminal slate (dark)</div>
<div class="grid-4">
  <div class="col">
    <div class="swatch" style="background:var(--bg-0);"></div>
    <div class="sw-meta"><div class="sw-name">bg-0</div><div class="sw-hex">#0B0F17 · canvas</div></div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--bg-1);"></div>
    <div class="sw-meta"><div class="sw-name">bg-1</div><div class="sw-hex">#11161F · surface</div></div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--bg-2);"></div>
    <div class="sw-meta"><div class="sw-name">bg-2</div><div class="sw-hex">#161C28 · elevated</div></div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--bg-3);"></div>
    <div class="sw-meta"><div class="sw-name">bg-3</div><div class="sw-hex">#1D2533 · hover</div></div>
  </div>
</div>
<div class="grid-2" style="margin-top:16px;">
  <div class="col">
    <div class="swatch" style="background:var(--bg-0); border-color:var(--border-1);"></div>
    <div class="sw-meta"><div class="sw-name">border-1</div><div class="sw-hex">white 8% · hairline</div></div>
  </div>
  <div class="col">
    <div class="swatch" style="background:var(--bg-0); border:1px solid var(--border-2);"></div>
    <div class="sw-meta"><div class="sw-name">border-2</div><div class="sw-hex">white 14% · hover</div></div>
  </div>
</div>
</body></html>
