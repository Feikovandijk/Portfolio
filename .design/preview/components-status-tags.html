<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .meta-row { font-family: var(--font-mono); font-size: 13px; color: var(--fg-2); line-height: 1.9; }
  .meta-row .k { color: var(--fg-3); }
  .meta-row .b { color: var(--k8s-blue-bright); }
  .state { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--fg-3); padding: 3px 0; }
  .tag { font-family: var(--font-mono); font-size: 12px; padding: 4px 10px; border-radius: var(--radius-pill);
    background: var(--bg-2); border: 1px solid var(--border-1); color: var(--fg-2); }
</style>
</head><body>
<div class="label" style="margin-bottom:14px;">Metadata caption · mono, restrained</div>
<div class="meta-row">
  <span class="k">role</span>&nbsp;&nbsp;technical design · devops<br>
  <span class="k">stack</span>&nbsp;&nbsp;<span class="b">unreal</span> · jenkins · perforce<br>
  <span class="k">years</span>&nbsp;&nbsp;2020 – 2022
</div>
<div class="label" style="margin:20px 0 10px;">State · text only, no badges</div>
<div class="row" style="gap:18px;">
  <span class="state">Released</span><span class="state">In development</span>
  <span class="state">Research</span><span class="state">Archived</span>
</div>
<div class="label" style="margin:20px 0 12px;">Tags</div>
<div class="wrap" style="gap:8px;">
  <span class="tag">Kubernetes</span><span class="tag">GitOps</span><span class="tag">Unreal Engine</span>
  <span class="tag">Technical Design</span><span class="tag">Python</span>
</div>
</body></html>
